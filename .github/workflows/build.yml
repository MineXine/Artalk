name: Build and Publish
run-name: Build and Publish ${{ inputs.version }} ${{ inputs.dry_run && '(Dry-Run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        type: string
        required: true
      dry_run:
        description: "Dry run"
        type: boolean
        default: false

  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  tagging:
    uses: ./.github/workflows/build-tagging.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  docker:
    needs: tagging
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ needs.tagging.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
      # Both platforms in a single buildx run. They previously ran as two
      # parallel jobs pushing the same tags, which is a race: whichever finished
      # last won, so the amd64-only job could overwrite the multi-arch manifest.
      target: linux/amd64,linux/arm64
      # Repository variable, so a fork publishes under its own account without
      # editing the workflow. Empty falls back to <dockerhub-user>/artalk.
      image: ${{ vars.DOCKER_IMAGE }}
    secrets: inherit

  app:
    needs: tagging
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ needs.tagging.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  done:
    needs: [tagging, docker, app]
    if: |
      always() &&
      needs.tagging.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.app.result == 'success'
    uses: ./.github/workflows/build-done.yml
    with:
      version: ${{ needs.tagging.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
