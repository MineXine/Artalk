name: Build Docker

# Two entry points share one definition:
#   workflow_call      — called by build.yml during a release
#   workflow_dispatch  — build (and optionally push) an image by hand from the
#                        Actions tab, e.g. to smoke-test a branch before tagging
run-name: >-
  Docker ${{ inputs.version || github.ref_name }} · ${{ inputs.target }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
      target:
        required: true
        type: string
      # Optional overrides so a fork can publish under its own account without
      # editing this file. Empty keeps the historic default.
      image:
        description: "Image repository (user/name). Empty uses the built-in default."
        required: false
        type: string
        default: ""
      push_latest:
        description: "Also tag the build as latest."
        required: false
        type: boolean
        default: true
      no_cache:
        description: "Rebuild without the build cache."
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version tag, e.g. v2.10.1. Leave empty to build the selected ref and
          tag it by branch + sha instead.
        type: string
        required: false
      target:
        description: "Target platforms."
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
          - linux/arm64
        default: linux/amd64
      dry_run:
        description: "Dry run — build only, do not push. Keep this on unless you mean to publish."
        type: boolean
        default: true
      push_latest:
        description: "Also tag as latest. This overwrites whatever latest points to now."
        type: boolean
        default: false
      image:
        description: "Image repository (user/name). Empty uses <dockerhub-user>/artalk."
        type: string
        required: false
      no_cache:
        description: "Rebuild without the build cache."
        type: boolean
        default: false

# Only the checkout needs the token, and it only reads.
permissions:
  contents: read

# Two runs that target the same version *and* the same platform set would fight
# over the same tags. Queue instead of cancel: cutting a push in half leaves the
# registry with a tag whose manifest list was never finished.
concurrency:
  group: docker-${{ inputs.version || github.ref_name }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  # This fork publishes under its own Docker Hub account (upstream uses
  # willowgod/artalk). Override per run with the image input, or globally with a
  # DOCKER_IMAGE repository variable, when publishing somewhere else.
  DEFAULT_IMAGE: 612901aauu/artalk
  NODE_VERSION: "22.19.0"

jobs:
  build_publish:
    runs-on: ubuntu-latest
    # arm64 goes through QEMU, which is slow but not this slow.
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An empty ref means "whatever this run was started from", which is
          # what a manual build of a branch wants.
          ref: ${{ inputs.version }}
          # metadata-action reads git to derive ref and sha tags.
          fetch-depth: 0

      - name: Resolve build inputs
        id: vars
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_IMAGE: ${{ inputs.image }}
          DOCKERHUB_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          # A tag is mandatory for metadata-action, so fall back to the commit
          # sha instead of passing an empty value through.
          version="${IN_VERSION:-}"
          if [ -z "$version" ]; then
            version="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            has_semver=false
          elif [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            has_semver=true
          else
            has_semver=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "has_semver=$has_semver" >> "$GITHUB_OUTPUT"

          # Prefer an explicit repository, then the account whose token we hold,
          # and only then the built-in default. A fork that sets its own
          # DOCKERHUB_USERNAME therefore never tries to push into someone else's
          # namespace.
          image="${IN_IMAGE:-}"
          if [ -z "$image" ]; then
            if [ -n "${DOCKERHUB_OWNER:-}" ]; then
              image="${DOCKERHUB_OWNER}/artalk"
            else
              image="${DEFAULT_IMAGE}"
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

          echo "Version tag : $version"
          echo "Image       : $image"
          echo "Platforms   : ${{ inputs.target }}"
          echo "Push        : ${{ !inputs.dry_run }}"
          echo "Tag latest  : ${{ inputs.push_latest }}"

      # https://github.com/docker/metadata-action
      - name: Gen docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.vars.outputs.version }},enable=${{ steps.vars.outputs.has_semver }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.version }},enable=${{ steps.vars.outputs.has_semver }}
            type=ref,event=branch,enable=${{ steps.vars.outputs.has_semver == 'false' }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      # https://github.com/docker/login-action
      - name: Login to DockerHub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # https://github.com/docker/setup-qemu-action
      # Nothing to emulate for a native build; skipping saves about a minute.
      - name: Setup QEMU
        if: contains(inputs.target, 'arm')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ inputs.target }}

      # https://github.com/docker/setup-buildx-action
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the UI outside the image so the Dockerfile does not have to install
      # a JS toolchain inside every build platform.
      #
      # The versions come from package.json "packageManager" and "engines.node".
      # scripts/build-frontend.sh only bootstraps its own toolchain when pnpm is
      # missing — and that path needs apt-get, hence sudo, which the runner user
      # does not have. Installing both here turns the fallback into dead code
      # instead of a failure.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Build UI
        run: make build-frontend

      # https://github.com/docker/build-push-action
      - name: Build and Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ !inputs.dry_run }}
          context: .
          file: ./Dockerfile
          build-args: |
            SKIP_UI_BUILD=true
            APP_COMMIT_HASH=${{ github.sha }}
          platforms: ${{ inputs.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Go layer is the expensive one and it barely changes between
          # releases; the layer cache is what makes a rebuild tolerable.
          cache-from: type=gha,scope=artalk
          cache-to: type=gha,mode=max,scope=artalk
          no-cache: ${{ inputs.no_cache }}

      - name: Print image digest
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          echo "image-id: ${{ steps.build.outputs.imageid }}"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.build.outcome }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "## Docker build"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| image | \`${{ steps.vars.outputs.image }}\` |"
            echo "| version | \`${{ steps.vars.outputs.version }}\` |"
            echo "| platforms | \`${{ inputs.target }}\` |"
            echo "| pushed | ${{ !inputs.dry_run }} |"
            echo "| latest | ${{ inputs.push_latest }} |"
            echo "| outcome | ${OUTCOME:-skipped} |"
            echo "| digest | \`${DIGEST:-—}\` |"
            echo ""
            echo "### Tags"
            echo ""
            if [ -n "${TAGS:-}" ]; then
              echo '```'
              echo "$TAGS"
              echo '```'
            else
              echo "_none_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
